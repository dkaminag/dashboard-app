name: Central Legal Agent Synthetic Staging E2E

on:
  pull_request:
    paths:
      - "dashboard-backend/central-legal-agent-staging-bridge.mjs"
      - "dashboard-backend/test-central-legal-agent-staging-bridge.mjs"
      - "dashboard-backend/central-legal-agent-session-binding.mjs"
      - "dashboard-backend/test-central-legal-agent-session-binding.mjs"
      - "dashboard-backend/CENTRAL_LEGAL_AGENT_STAGING_BRIDGE_20260928.md"
      - ".github/workflows/central-legal-agent-staging-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: central-legal-agent-staging-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Prove no-secret synthetic staging bridge
        shell: bash
        run: |
          set -euo pipefail
          test -z "${LEGAL_DATABASE_URL:-}"
          test -z "${GROQ_API_KEY:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${CJ_DATABASE_URL:-}"
          node --check dashboard-backend/central-legal-agent-staging-bridge.mjs
          node dashboard-backend/test-central-legal-agent-staging-bridge.mjs
          node --check dashboard-backend/central-legal-agent-session-binding.mjs
          node dashboard-backend/test-central-legal-agent-session-binding.mjs
          echo "CENTRAL_LEGAL_AGENT_SYNTHETIC_STAGING_E2E=PASS"
