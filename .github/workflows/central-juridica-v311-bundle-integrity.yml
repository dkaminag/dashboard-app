name: Central Juridica v3.1.1 Bundle Integrity

on:
  push:
    branches:
      - audit/central-juridica-pg-gate
    paths:
      - "central-juridica-railway-v3.1.1/runtime.bundle.part*.b64"
      - ".github/workflows/central-juridica-v311-bundle-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sealed-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact v3.1.1 transport bundle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const zlib = require('node:zlib');
          const path = require('node:path');
          const root = 'central-juridica-railway-v3.1.1';
          const expected = 'b4cfd699b7667411fd89ed78b7766ee31e1c87f1813cb3827d2186ca456cc8f0';
          const parts = Array.from({length:9}, (_,i)=>`runtime.bundle.part${String(i+1).padStart(2,'0')}.b64`);
          for (const part of parts) {
            const p = path.join(root, part);
            if (!fs.existsSync(p)) throw new Error(`MISSING_PART:${part}`);
          }
          const encoded = parts.map(p=>fs.readFileSync(path.join(root,p),'utf8')).join('').replace(/\s+/g,'');
          const digest = crypto.createHash('sha256').update(encoded).digest('hex');
          if (digest !== expected) throw new Error(`BUNDLE_SHA256_MISMATCH:${digest}`);
          const raw = zlib.gunzipSync(Buffer.from(encoded,'base64')).toString('utf8');
          const files = JSON.parse(raw);
          const names = Object.keys(files).sort();
          if (names.length !== 44) throw new Error(`FILE_COUNT_MISMATCH:${names.length}`);
          for (const name of names) {
            if (!(name === 'package.json' || /^(src|public|data|contracts)\//.test(name)) || name.includes('..')) {
              throw new Error(`INVALID_RUNTIME_PATH:${name}`);
            }
          }
          if (JSON.parse(files['package.json']).version !== '3.1.1') throw new Error('RUNTIME_VERSION_MISMATCH');
          console.log(JSON.stringify({ok:true,version:'3.1.1',parts:9,files:names.length,sha256:digest,allowlist:true}));
          NODE
