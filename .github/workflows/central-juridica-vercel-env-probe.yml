name: Central Juridica Vercel Production Probe

on:
  push:
    branches:
      - audit/central-juridica-pg-gate
    paths:
      - ".github/workflows/central-juridica-vercel-env-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production unique URL and primary alias
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"; url="$2"
            rm -f "${label}.headers" "${label}.body"
            code=$(curl -sS --max-time 30 -D "${label}.headers" -o "${label}.body" -w '%{http_code}' "$url" || true)
            location=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"",$2); print $2; exit}' "${label}.headers" || true)
            echo "${label}_HTTP=$code"
            echo "${label}_LOCATION=${location:-none}"
            echo "${label}_BODY_PREFIX=$(head -c 240 "${label}.body" | tr '\n' ' ' || true)"
          }
          probe UNIQUE 'https://central-juridica-v3-public-probe-e822h38go-dkaminag-2666.vercel.app/'
          probe ALIAS 'https://central-juridica-v3-public-probe-dkaminag-2666.vercel.app/'
          test "$(awk 'NR==1{print $2}' ALIAS.headers)" = '200'
          ! grep -Eqi '^location:.*vercel\.com' ALIAS.headers
          grep -q 'CJ_PRODUCTION_PROBE_OK' ALIAS.body
          grep -Eq '"env"[[:space:]]*:[[:space:]]*true' ALIAS.body
          echo 'PRIMARY_ALIAS_PUBLIC_HTTPS=PASS'
          echo 'FUNCTION_RUNTIME=PASS'
          echo 'ENV_INJECTION=PASS'
