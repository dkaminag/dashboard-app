name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install and validate backend
        working-directory: dashboard-backend
        run: |
          npm install
          npm test
      - name: Build backend image
        run: docker build -t dashboard-backend:ci ./dashboard-backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install and build frontend
        working-directory: dashboard-frontend
        run: |
          npm install
          npm run build
      - name: Build frontend image
        run: docker build -t dashboard-frontend:ci ./dashboard-frontend

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install and validate AI service
        working-directory: dashboard-ai
        run: |
          pip install -r requirements.txt
          python -m py_compile main.py
      - name: Build AI image
        run: docker build -t dashboard-ai:ci ./dashboard-ai

  validation:
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai]
    steps:
      - run: echo "CI_VALIDATION=PASS"
