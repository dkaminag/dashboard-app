name: Central Juridica Hosted Smoke

on:
  push:
    branches:
      - audit/central-juridica-pg-gate
    paths:
      - ".github/workflows/central-juridica-hosted-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public health and readiness
        env:
          BASE_URL: https://central-juridica-v3-1-1-cutover-production.up.railway.app
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            HEALTH_CODE=$(curl -sS -o health.json -w '%{http_code}' --max-time 15 "$BASE_URL/api/health" || true)
            READY_CODE=$(curl -sS -o ready.json -w '%{http_code}' --max-time 15 "$BASE_URL/api/ready" || true)
            if [ "$HEALTH_CODE" = "200" ] && [ "$READY_CODE" = "200" ]; then break; fi
            sleep 3
          done
          test "$HEALTH_CODE" = "200"
          test "$READY_CODE" = "200"
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('health.json','utf8'));
          const r=JSON.parse(fs.readFileSync('ready.json','utf8'));
          if(h.version!=='3.1.1'||h.ok!==true) throw new Error('health gate failed');
          if(r.version!=='3.1.1'||r.ok!==true||r.ready!==true||r.backend!=='postgres') throw new Error('readiness gate failed');
          if(r.checks && Object.prototype.hasOwnProperty.call(r.checks,'database') && r.checks.database!==true) throw new Error('database check failed');
          const evidence={
            checkedAt:new Date().toISOString(),
            baseUrl:'https://central-juridica-v3-1-1-cutover-production.up.railway.app',
            healthHttp:200,
            readyHttp:200,
            health:{ok:h.ok,version:h.version,backend:h.backend||null,productionGuard:h.productionGuard??null,documentsEnabled:h.documentsEnabled??null,integrations:h.integrations||null,requestSecurity:h.requestSecurity||null},
            readiness:{ok:r.ok,ready:r.ready,version:r.version,backend:r.backend,checks:r.checks||null,decision:r.decision||null}
          };
          fs.writeFileSync('hosted-smoke-evidence.json',JSON.stringify(evidence,null,2));
          console.log(JSON.stringify(evidence));
          NODE
      - name: Upload hosted smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-juridica-v3-1-1-final-hosted-smoke
          path: hosted-smoke-evidence.json
