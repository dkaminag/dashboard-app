name: Central Juridica Secret Authority Probe
on:
  push:
    branches:
      - audit/central-juridica-pg-gate
    paths:
      - ".github/workflows/central-juridica-secret-authority-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret authority presence only
        env:
          HAS_AUDIT: ${{ secrets.CJ_AUDIT_KEYRING != '' }}
          HAS_BACKUP: ${{ secrets.CJ_BACKUP_KEYRING != '' }}
          HAS_DOCUMENT: ${{ secrets.CJ_DOCUMENT_KEYRING != '' }}
          HAS_MFA: ${{ secrets.CJ_MFA_KEYRING != '' }}
          HAS_IDEMPOTENCY: ${{ secrets.CJ_IDEMPOTENCY_KEY != '' }}
          HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          printf '{"event":"secret-authority-presence","audit":"%s","backup":"%s","document":"%s","mfa":"%s","idempotency":"%s","railwayToken":"%s"}\n' "$HAS_AUDIT" "$HAS_BACKUP" "$HAS_DOCUMENT" "$HAS_MFA" "$HAS_IDEMPOTENCY" "$HAS_RAILWAY_TOKEN"
