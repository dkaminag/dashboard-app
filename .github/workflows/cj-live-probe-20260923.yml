name: Central Juridica Live Probe 2026-09-23
on:
  push:
    branches:
      - audit/cj-live-probe-20260923-current
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://central-juridica-v3-1-1-cutover-production.up.railway.app
    steps:
      - name: Probe public runtime
        shell: bash
        run: |
          set -euo pipefail
          root_code=$(curl -sS -o root.html -w '%{http_code}' "$BASE_URL/")
          health_code=$(curl -sS -o health.json -w '%{http_code}' "$BASE_URL/api/health")
          ready_code=$(curl -sS -o ready.json -w '%{http_code}' "$BASE_URL/api/ready")
          dash_code=$(curl -sS -o dashboard.json -w '%{http_code}' "$BASE_URL/api/dashboard")
          node - <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('health.json','utf8'));
          const ready=JSON.parse(fs.readFileSync('ready.json','utf8'));
          console.log(JSON.stringify({
            root:process.env.ROOT_CODE,
            healthStatus:process.env.HEALTH_CODE,
            readyStatus:process.env.READY_CODE,
            dashboardUnauth:process.env.DASH_CODE,
            healthOk:health.ok,
            version:health.version,
            readyOk:ready.ok,
            ready:ready.ready,
            decision:ready.decision||ready.status||null,
            missing:Array.isArray(ready.missing)?ready.missing:[],
            missingGates:Array.isArray(ready.missingGates)?ready.missingGates:[]
          }));
          NODE
        env:
          ROOT_CODE: ${{ steps.codes.outputs.root || '' }}
          HEALTH_CODE: ${{ steps.codes.outputs.health || '' }}
          READY_CODE: ${{ steps.codes.outputs.ready || '' }}
          DASH_CODE: ${{ steps.codes.outputs.dash || '' }}
      - name: Probe with explicit assertions and sanitized output
        shell: bash
        run: |
          set -euo pipefail
          root_code=$(curl -sS -o root.html -w '%{http_code}' "$BASE_URL/")
          health_code=$(curl -sS -o health.json -w '%{http_code}' "$BASE_URL/api/health")
          ready_code=$(curl -sS -o ready.json -w '%{http_code}' "$BASE_URL/api/ready")
          dash_code=$(curl -sS -o dashboard.json -w '%{http_code}' "$BASE_URL/api/dashboard")
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('health.json','utf8'));
          const r=JSON.parse(fs.readFileSync('ready.json','utf8'));
          console.log('SANITIZED_READY='+JSON.stringify({ok:r.ok,ready:r.ready,decision:r.decision||r.status||null,missing:r.missing||[],missingGates:r.missingGates||[],version:h.version}));
          NODE
          printf 'HTTP root=%s health=%s ready=%s dashboard_unauth=%s\n' "$root_code" "$health_code" "$ready_code" "$dash_code"
          test "$root_code" = "200"
          test "$health_code" = "200"
          test "$ready_code" = "200"
          test "$dash_code" = "401"
