name: Debug Central Juridica MFA UI

on:
  push:
    branches:
      - debug/central-juridica-mfa-ui-20260916
    paths:
      - ".github/workflows/debug-central-juridica-mfa-ui.yml"
      - "central-juridica-railway-v3.1.1/**"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build patched runtime
        working-directory: central-juridica-railway-v3.1.1
        run: npm run build
      - name: Access verification UI gate
        working-directory: central-juridica-railway-v3.1.1
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('runtime/public/app.js').read_text('utf-8')
          required=["function showAccessSetup(","function showSecondFactor(","r.mfaEnrollmentRequired","err.data?.mfaRequired","if(err.handled)return","Verificação de acesso","Confirmar acesso"]
          missing=[x for x in required if x not in app]
          if missing: raise SystemExit(f'MISSING_PATCH_MARKERS:{missing}')
          forbidden=['Ativação de MFA','Código MFA','Segundo fator obrigatório','Código TOTP']
          leaked=[x for x in forbidden if x in app]
          if leaked: raise SystemExit(f'VISIBLE_MFA_JARGON:{leaked}')
          print({'ok':True,'loop403Fixed':True,'firstAccessHandled':True,'secondFactorHandled':True,'visibleMfaJargon':False})
          PY
      - name: Backend MFA preservation gate
        working-directory: central-juridica-railway-v3.1.1
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('runtime/src/server.mjs').read_text('utf-8')
          required=["verifyTotp(","/api/users/me/mfa/setup","/api/users/me/mfa/enable","mfaEnrollmentRequired","requiredMfaRoles()"]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit(f'BACKEND_MFA_REGRESSION:{missing}')
          print({'ok':True,'backendMfaPreserved':True})
          PY
      - name: External Railway production UI gate
        run: |
          set -euo pipefail
          base='https://central-juridica-v3-1-1-cutover-production.up.railway.app'
          curl -fsS --retry 4 --retry-delay 2 "$base/api/health" -o /tmp/health.json
          curl -fsS --retry 4 --retry-delay 2 "$base/api/ready" -o /tmp/ready.json
          curl -fsS --retry 4 --retry-delay 2 "$base/app.js" -o /tmp/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('/tmp/health.json').read_text())
          r=json.loads(Path('/tmp/ready.json').read_text())
          app=Path('/tmp/app.js').read_text()
          if h.get('ok') is not True or h.get('version')!='3.1.1' or h.get('backend')!='postgres': raise SystemExit(f'HEALTH_BAD:{h}')
          if r.get('ok') is not True or r.get('backend')!='postgres' or (r.get('probe') or {}).get('ok') is not True: raise SystemExit(f'READY_BAD:{r}')
          required=['function showAccessSetup(','function showSecondFactor(','Verificação de acesso','Confirmar acesso','if(err.handled)return']
          missing=[x for x in required if x not in app]
          if missing: raise SystemExit(f'DEPLOYED_PATCH_MISSING:{missing}')
          forbidden=['Ativação de MFA','Código MFA','Segundo fator obrigatório','Código TOTP']
          leaked=[x for x in forbidden if x in app]
          if leaked: raise SystemExit(f'DEPLOYED_VISIBLE_MFA_JARGON:{leaked}')
          print({'ok':True,'productionVersion':h.get('version'),'ready':True,'deployedPatch':True,'visibleMfaJargon':False})
          PY
