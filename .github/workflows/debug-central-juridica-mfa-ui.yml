name: Debug Central Juridica MFA UI

on:
  push:
    branches:
      - debug/central-juridica-mfa-ui-20260916
    paths:
      - ".github/workflows/debug-central-juridica-mfa-ui.yml"
      - "central-juridica-railway-v3.1.1/**"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build patched runtime
        working-directory: central-juridica-railway-v3.1.1
        run: npm run build
      - name: Access verification UI gate
        working-directory: central-juridica-railway-v3.1.1
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('runtime/public/app.js').read_text('utf-8')
          required=[
            "function showAccessSetup(",
            "function showSecondFactor(",
            "r.mfaEnrollmentRequired",
            "err.data?.mfaRequired",
            "if(err.handled)return",
            "Verificação de acesso",
            "Confirmar acesso"
          ]
          missing=[x for x in required if x not in app]
          if missing: raise SystemExit(f'MISSING_PATCH_MARKERS:{missing}')
          forbidden=['Ativação de MFA','Código MFA','Segundo fator obrigatório','Código TOTP']
          leaked=[x for x in forbidden if x in app]
          if leaked: raise SystemExit(f'VISIBLE_MFA_JARGON:{leaked}')
          if "showAccessSetup(); const err=new Error('Verificação de acesso pendente.')" not in app:
              raise SystemExit('ENROLLMENT_403_NOT_HANDLED')
          if "await beginAccessSetup(password);return;" not in app:
              raise SystemExit('FIRST_LOGIN_ENROLLMENT_NOT_HANDLED')
          print({'ok':True,'loop403Fixed':True,'firstAccessHandled':True,'secondFactorHandled':True,'visibleMfaJargon':False})
          PY
      - name: Backend MFA preservation gate
        working-directory: central-juridica-railway-v3.1.1
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('runtime/src/server.mjs').read_text('utf-8')
          required=["verifyTotp(","/api/users/me/mfa/setup","/api/users/me/mfa/enable","mfaEnrollmentRequired","requiredMfaRoles()"]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit(f'BACKEND_MFA_REGRESSION:{missing}')
          print({'ok':True,'backendMfaPreserved':True})
          PY
