name: Debug Central Juridica MFA UI

on:
  push:
    branches:
      - debug/central-juridica-mfa-ui-20260916
    paths:
      - ".github/workflows/debug-central-juridica-mfa-ui.yml"
      - "central-juridica-railway-v3.1.1/**"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unpack canonical runtime
        working-directory: central-juridica-railway-v3.1.1
        run: node unpack.mjs
      - name: Inspect public UI and cache behavior
        working-directory: central-juridica-railway-v3.1.1
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('runtime')
          print('=== PUBLIC FILE TREE ===')
          for p in sorted((root/'public').rglob('*')):
              if p.is_file(): print(f'{p} size={p.stat().st_size}')
          print('=== PUBLIC TEXT CONTENT ===')
          for p in sorted((root/'public').rglob('*')):
              if not p.is_file() or p.suffix.lower() not in {'.html','.js','.mjs','.css','.json','.txt'}: continue
              try: text=p.read_text('utf-8')
              except Exception: continue
              print(f'--- {p} ---')
              print(text[:60000])
              if len(text)>60000: print(f'...[TRUNCATED {len(text)-60000} chars]')
          print('=== STATIC SERVER / CACHE REFERENCES ===')
          pats=re.compile(r'(?i)(cache-control|etag|serveStatic|public/|index\.html|readFile|createReadStream|content-type|mfaEnrollmentRequired|setupPending|security|seguran|identidade|go-live)')
          for p in sorted((root/'src').rglob('*')):
              if not p.is_file() or p.suffix.lower() not in {'.js','.mjs'}: continue
              try: lines=p.read_text('utf-8').splitlines()
              except Exception: continue
              hits=[i for i,l in enumerate(lines) if pats.search(l)]
              if not hits: continue
              print(f'--- {p} ---')
              shown=set()
              for i in hits:
                  for j in range(max(0,i-4),min(len(lines),i+5)):
                      if j not in shown:
                          print(f'{j+1:05d}: {lines[j]}'); shown.add(j)
                  print('---')
          PY
