name: Debug Central Juridica MFA UI

on:
  push:
    branches:
      - debug/central-juridica-mfa-ui-20260916
    paths:
      - ".github/workflows/debug-central-juridica-mfa-ui.yml"
      - "central-juridica-railway-v3.1.1/**"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unpack canonical runtime
        working-directory: central-juridica-railway-v3.1.1
        run: node unpack.mjs
      - name: Locate MFA UI references
        working-directory: central-juridica-railway-v3.1.1
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('runtime')
          pats=re.compile(r'(?i)(mfa|totp|segundo\s+fator|autentica.{0,12}fator|identidade\s*&\s*go-live|recovery\s*code|c[oó]digos?\s+de\s+recupera)')
          for base in [root/'public', root/'src']:
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.html','.js','.mjs','.css','.json'}:
                      continue
                  try: text=p.read_text('utf-8')
                  except Exception: continue
                  lines=text.splitlines()
                  hits=[i for i,l in enumerate(lines) if pats.search(l)]
                  if not hits: continue
                  print(f'=== {p} ===')
                  shown=set()
                  for i in hits:
                      for j in range(max(0,i-5), min(len(lines),i+6)):
                          if j not in shown:
                              print(f'{j+1:05d}: {lines[j]}')
                              shown.add(j)
                      print('---')
          PY
