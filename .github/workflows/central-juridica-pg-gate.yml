name: Central Juridica PostgreSQL Gate

on:
  push:
    branches:
      - audit/central-juridica-pg-gate
    paths:
      - "central-juridica-gate/**"
      - ".github/workflows/central-juridica-pg-gate.yml"
  workflow_dispatch:

concurrency:
  group: central-juridica-pg-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-concurrency-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: central_juridica
          POSTGRES_USER: central_juridica
          POSTGRES_PASSWORD: ci-gate-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U central_juridica -d central_juridica"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CJ_DATABASE_URL: postgres://central_juridica:ci-gate-only@127.0.0.1:5432/central_juridica
    defaults:
      run:
        working-directory: central-juridica-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install driver
        run: npm install --no-audit --no-fund
      - name: Static check
        run: npm run check
      - name: Run v1.5 regression gate
        run: set -o pipefail; npm run gate | tee gate-evidence.json
      - name: Run v1.6 keyring rotation gate
        run: set -o pipefail; npm run keyring-gate | tee keyring-v1-6-evidence.json
      - name: Run v1.7 shared rate limit gate
        run: set -o pipefail; npm run rate-limit-gate | tee rate-limit-v1-7-evidence.json
      - name: Run v1.8 dedicated session gate
        run: set -o pipefail; npm run session-gate | tee session-v1-8-evidence.json
      - name: Run v1.9 dedicated user gate
        run: set -o pipefail; npm run user-gate | tee user-v1-9-evidence.json
      - name: Run v2.0 dedicated audit gate
        run: set -o pipefail; npm run audit-v2-gate | tee audit-v2-evidence.json
      - name: Run v2.1 dedicated idempotency gate
        run: set -o pipefail; npm run idempotency-v2-1-gate | tee idempotency-v2-1-evidence.json
      - name: Run v2.2 dedicated task gate
        run: set -o pipefail; npm run tasks-v2-2-gate | tee tasks-v2-2-evidence.json
      - name: Run v2.3 dedicated process gate
        run: set -o pipefail; npm run processes-v2-3-gate | tee processes-v2-3-evidence.json
      - name: Run v2.4 task no-key regression
        run: set -o pipefail; npm run task-no-key-v2-4-regression | tee task-no-key-v2-4-evidence.json
      - name: Run v2.4 dedicated agreement gate
        run: set -o pipefail; npm run agreements-v2-4-gate | tee agreements-v2-4-evidence.json
      - name: Run v2.5 dedicated execution gate
        run: set -o pipefail; npm run executions-v2-5-gate | tee executions-v2-5-evidence.json
      - name: Run v2.6 dedicated finance gate
        run: set -o pipefail; npm run finance-v2-6-gate | tee finance-v2-6-evidence.json
      - name: Run v2.7 dedicated preventive gate
        run: set -o pipefail; npm run preventive-v2-7-gate | tee preventive-v2-7-evidence.json
      - name: Run v2.8 dedicated external evidence gate
        run: set -o pipefail; npm run external-evidence-v2-8-gate | tee external-evidence-v2-8-evidence.json
      - name: Run v2.9 dedicated client gate
        run: set -o pipefail; npm run clients-v2-9-gate | tee clients-v2-9-evidence.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-juridica-postgres-gate-evidence
          path: |
            central-juridica-gate/gate-evidence.json
            central-juridica-gate/keyring-v1-6-evidence.json
            central-juridica-gate/rate-limit-v1-7-evidence.json
            central-juridica-gate/session-v1-8-evidence.json
            central-juridica-gate/user-v1-9-evidence.json
            central-juridica-gate/audit-v2-evidence.json
            central-juridica-gate/idempotency-v2-1-evidence.json
            central-juridica-gate/tasks-v2-2-evidence.json
            central-juridica-gate/processes-v2-3-evidence.json
            central-juridica-gate/task-no-key-v2-4-evidence.json
            central-juridica-gate/agreements-v2-4-evidence.json
            central-juridica-gate/executions-v2-5-evidence.json
            central-juridica-gate/finance-v2-6-evidence.json
            central-juridica-gate/preventive-v2-7-evidence.json
            central-juridica-gate/external-evidence-v2-8-evidence.json
            central-juridica-gate/clients-v2-9-evidence.json
