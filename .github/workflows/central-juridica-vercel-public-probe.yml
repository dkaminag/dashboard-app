name: Central Juridica Vercel Public Probe

on:
  push:
    branches:
      - audit/central-juridica-pg-gate
    paths:
      - ".github/workflows/central-juridica-vercel-public-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe primary production domain anonymously
        shell: bash
        env:
          TARGET_URL: "https://central-juridica-protection-probe.vercel.app/"
        run: |
          set -euo pipefail
          h1="$(mktemp)"
          b1="$(mktemp)"
          initial_code="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --dump-header "$h1" --output "$b1" --write-out '%{http_code}' "$TARGET_URL")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{print $2}' "$h1" | tr -d '\r' | head -n1 || true)"
          location_host="$(printf '%s' "$location" | sed -E 's#^https?://([^/]+).*$#\1#' | cut -c1-160)"
          echo "INITIAL_HTTP_STATUS=$initial_code"
          echo "REDIRECT_HOST=${location_host:-none}"
          sso=false
          if grep -qi 'vercel.com/sso-api' "$h1" "$b1"; then sso=true; fi
          echo "SSO_INTERCEPTION=$sso"
          marker=false
          if grep -q 'STANDARD_PROTECTION_PRODUCTION_PUBLIC_OK' "$b1"; then marker=true; fi
          echo "EXPECTED_MARKER=$marker"
          test "$initial_code" = "200"
          test "$marker" = "true"
          test "$sso" = "false"
          echo "PUBLIC_HTTPS_GATE=PASS"
