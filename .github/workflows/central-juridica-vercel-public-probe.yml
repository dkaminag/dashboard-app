name: Central Juridica Vercel Public Probe

on:
  push:
    branches:
      - audit/central-juridica-pg-gate
    paths:
      - ".github/workflows/central-juridica-vercel-public-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe production alias anonymously
        shell: bash
        env:
          TARGET_URL: "https://central-juridica-protection-probe-dkaminag-2666.vercel.app/"
        run: |
          set -euo pipefail
          h1="$(mktemp)"
          b1="$(mktemp)"
          initial_code="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --dump-header "$h1" --output "$b1" --write-out '%{http_code}' "$TARGET_URL")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{print $2}' "$h1" | tr -d '\r' | head -n1 || true)"
          location_host="$(printf '%s' "$location" | sed -E 's#^https?://([^/]+).*$#\1#' | cut -c1-160)"
          echo "INITIAL_HTTP_STATUS=$initial_code"
          echo "REDIRECT_HOST=${location_host:-none}"

          h2="$(mktemp)"
          b2="$(mktemp)"
          set +e
          final_meta="$(curl --silent --show-error --location --max-redirs 3 --connect-timeout 10 --max-time 20 --dump-header "$h2" --output "$b2" --write-out '%{http_code} %{url_effective}' "$TARGET_URL")"
          curl_rc=$?
          set -e
          read -r final_code final_url <<< "$final_meta"
          echo "CURL_RC=$curl_rc"
          echo "FINAL_HTTP_STATUS=${final_code:-none}"
          echo "FINAL_HOST=$(printf '%s' "${final_url:-}" | sed -E 's#^https?://([^/]+).*$#\1#' | cut -c1-160)"

          sso=false
          if grep -qi 'vercel.com/sso-api' "$h1" "$h2" "$b1" "$b2"; then sso=true; fi
          echo "SSO_INTERCEPTION=$sso"
          marker=false
          if grep -q 'STANDARD_PROTECTION_PRODUCTION_PUBLIC_OK' "$b1" "$b2"; then marker=true; fi
          echo "EXPECTED_MARKER=$marker"

          test "$initial_code" = "200"
          test "$marker" = "true"
          test "$sso" = "false"
          echo "PUBLIC_HTTPS_GATE=PASS"
