name: Central Juridica v3.2 Audit Keyring Diagnostic

on:
  push:
    branches:
      - audit/central-juridica-v32-audit-keyring-20260922

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Reconstruct v3.2 runtime
        working-directory: central-juridica-railway-v3.2.0
        run: npm run build

      - name: Print keyring-relevant source only
        working-directory: central-juridica-railway-v3.2.0
        run: |
          echo '=== store-factory.mjs ==='
          sed -n '1,240p' runtime/src/store-factory.mjs
          echo '=== audit-integrity keyring API ==='
          sed -n '1,48p' runtime/src/audit-integrity.mjs
          grep -n -E 'loadAuditKeyring|createAudit|keyring|activeKey|development-v1' runtime/src/audit-integrity.mjs | head -n 120 || true
          echo '=== keyring parser ==='
          sed -n '1,180p' runtime/src/keyring.mjs
          echo '=== postgres-store createStore usage ==='
          grep -n -E 'audit|keyring|createStore|PostgresStateStore' runtime/src/postgres-store.mjs | head -n 160 || true

      - name: Print all keyring loader contracts
        working-directory: central-juridica-railway-v3.2.0
        run: |
          echo '=== KEYRING_LOADER_CONTRACTS ==='
          grep -R -n -E 'parseKeyring|legacyEnvName|defaultKeyId|CJ_[A-Z0-9_]+KEY(RING)?|CJ_IDEMPOTENCY_KEY' runtime/src | head -n 500 || true
          echo '=== DOCUMENT_CRYPTO ==='
          sed -n '1,220p' runtime/src/crypto-storage.mjs || true
          echo '=== BACKUP_CRYPTO_CANDIDATES ==='
          grep -R -n -E 'backup.*key|key.*backup|BACKUP_KEY|BACKUP_KEYRING' runtime/src | head -n 300 || true
          echo '=== MFA_CRYPTO_CANDIDATES ==='
          grep -R -n -E 'mfa.*key|key.*mfa|MFA_KEY|MFA_KEYRING' runtime/src | head -n 300 || true
          echo '=== IDEMPOTENCY_CANDIDATES ==='
          grep -R -n -E 'IDEMPOTENCY|idempotency.*key|key.*idempotency' runtime/src | head -n 300 || true

      - name: Summary
        run: echo CJ_V32_AUDIT_KEYRING_DIAGNOSTIC=PASS
